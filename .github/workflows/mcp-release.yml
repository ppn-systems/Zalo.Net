name: Release Zalo.Net.Mcp Executables

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64 Single File
        run: |
          dotnet publish mcp/Zalo.Net.Mcp/Zalo.Net.Mcp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o release/win-x64
          mv release/win-x64/Zalo.Net.Mcp.exe release/Zalo.Net.Mcp-win-x64.exe

      - name: Publish osx-x64 Single File
        run: |
          dotnet publish mcp/Zalo.Net.Mcp/Zalo.Net.Mcp.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -o release/osx-x64
          mv release/osx-x64/Zalo.Net.Mcp release/Zalo.Net.Mcp-osx-x64

      - name: Publish osx-arm64 Single File
        run: |
          dotnet publish mcp/Zalo.Net.Mcp/Zalo.Net.Mcp.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -o release/osx-arm64
          mv release/osx-arm64/Zalo.Net.Mcp release/Zalo.Net.Mcp-osx-arm64

      - name: Publish linux-x64 Single File
        run: |
          dotnet publish mcp/Zalo.Net.Mcp/Zalo.Net.Mcp.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o release/linux-x64
          mv release/linux-x64/Zalo.Net.Mcp release/Zalo.Net.Mcp-linux-x64

      - name: Upload Release Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Zalo.Net.Mcp-win-x64.exe
            release/Zalo.Net.Mcp-osx-x64
            release/Zalo.Net.Mcp-osx-arm64
            release/Zalo.Net.Mcp-linux-x64
